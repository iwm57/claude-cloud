# Claude Cloud - Self-healing development environment
# Usage: docker compose up -d
services:
  claude-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: claude-cloud:latest
    container_name: claude-cloud

    # Keep container running
    restart: unless-stopped

    # Persistent volumes
    volumes:
      - claude-data:/root/.claude
      - workspace:/workspace

    # Environment variables (use .env file for sensitive values)
    environment:
      # GitHub token for gh CLI authentication
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # API key for kindly-web-search MCP server (passed to kindly service)
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # API key for z.ai coding-helper
      - Z_AI_API_KEY=${Z_AI_API_KEY:-}
      # URL for kindly-web-search HTTP endpoint (FastMCP default path is /mcp/)
      - KINDLY_WEB_SEARCH_URL=http://kindly-web-search:8000/mcp/

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "sh", "-c", "command -v claude"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # Labels for Coolify
    labels:
      - "com.coolify.description=Claude Cloud Development Environment"
      - "com.coolify.type=development"

    # Connect to kindly-web-search service
    depends_on:
      kindly-web-search:
        condition: service_started

  kindly-web-search:
    build:
      context: https://github.com/Shelpuk-AI-Technology-Consulting/kindly-web-search-mcp-server.git
      dockerfile: Dockerfile
    image: kindly-web-search:latest
    container_name: kindly-web-search
    restart: unless-stopped

    environment:
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000

    ports:
      - "8000:8000"

    # Run with HTTP transport
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]

    # Health check
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    labels:
      - "com.coolify.description=Kindly Web Search MCP Server (HTTP transport)"

# Named volumes (auto-created by Docker)
volumes:
  claude-data:
    driver: local
  workspace:
    driver: local
